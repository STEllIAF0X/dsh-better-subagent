# bundle patch for dsh-better-subagent: inserts its plugin row into the profile
# roster. Applied as a profile bundle layer (the `dsh.bundle.patch` manifest
# field) when the package is installed as a bundle; a manual install adds the
# same row to the active profile's cordis.patch.yml.
#
# The row is a bare plugin by package name: the node half (exports ".") owns the
# default child route and the `wait_subagents` tool, and the `dsh.client`
# declaration in package.json makes the browser half (exports "./client") load in
# the web GUI, where it contributes the Subagent page section and the subagent
# conversation's model badge.
#
# The row id is also the settings namespace the browser half edits, so it must
# match the id used in the profile patch.
#
# `enabled` starts off so installing the plugin changes no delegation behaviour
# until the user turns it on and picks a route on that page.
- insert:
    - id: dsh-better-subagent
      name: dsh-better-subagent
      config:
        enabled: false
        provider: ''
        model: ''
        reasoningEffort: ''
        includeForkChildren: true
        waitTool: true
